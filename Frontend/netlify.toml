[build]
  command = "npm run build"
  publish = "dist"

# Headers for Google OAuth popup compatibility (Cross-Origin-Opener-Policy)
# Allows window.closed checks when OAuth popup returns - required for Google Sign-In
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Configure secrets scanning
# Vite injects environment variables at build time, which is expected behavior
# These are public env vars (VITE_*) meant to be in the client bundle
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_URL,VITE_GOOGLE_CLIENT_ID"
  SECRETS_SCAN_OMIT_PATHS = "dist/**/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
